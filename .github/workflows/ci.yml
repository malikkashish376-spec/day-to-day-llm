name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit and integration tests
        env:
          PYTHONPATH: src
          DAYTODAY_LLM_PROVIDER: mock
        run: |
          # Earlier commits in this history predate the suite; skip cleanly
          # there so every commit has a meaningful status instead of a red X.
          if [ -d tests ]; then python -m pytest -q; else echo "no test suite at this commit"; fi
      - name: Evaluation harness (offline, mock provider)
        env:
          PYTHONPATH: src
        run: |
          if [ -f eval/run_eval.py ]; then
            python eval/run_eval.py --baseline
            python eval/run_eval.py
          else
            echo "no evaluation harness at this commit"
          fi
      - name: Seed and CLI smoke test
        env:
          PYTHONPATH: src
        run: |
          python -m daytoday.cli seed
          python -m daytoday.cli ask "plan my day"
