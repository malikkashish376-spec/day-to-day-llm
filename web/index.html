<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DayToDay-LLM</title>
<style>
  :root{
    --bg:#0d1117; --panel:#141b23; --panel-2:#1a232d; --line:#243040;
    --ink:#e6edf3; --muted:#8b98a8; --accent:#4cc38a; --accent-2:#4a9eff;
    --warn:#e3b341; --bad:#f85149; --radius:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  h1{font-size:16px;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12px}
  .pill{margin-left:auto;font:12px var(--mono);padding:4px 10px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--muted)}
  .pill b{color:var(--accent);font-weight:600}
  main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px;
    max-width:1280px;margin:0 auto;height:calc(100vh - 60px)}
  @media(max-width:900px){main{grid-template-columns:1fr;height:auto}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    display:flex;flex-direction:column;min-height:0}
  #log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
  .user{align-self:flex-end;background:#1f3b57;border:1px solid #2c5273}
  .bot{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line)}
  .meta{align-self:flex-start;display:flex;flex-wrap:wrap;gap:6px;margin-top:-8px}
  .chip{font:11px var(--mono);padding:3px 8px;border-radius:6px;background:#101820;
    border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .chip.tool{border-color:#2b5c43;color:#7ee2b8}
  .chip.note{border-color:#2f4a6b;color:#8fc3ff}
  .chip.err{border-color:#6b2f2f;color:#ff9d94}
  .chip:hover{filter:brightness(1.35)}
  .trace{display:none;margin-top:6px;font:11.5px/1.5 var(--mono);color:#9fb0c3;
    background:#0b1219;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    max-height:220px;overflow:auto;white-space:pre-wrap}
  .trace.open{display:block}
  form{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}
  input[type=text]{flex:1;background:#0b1219;border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;color:var(--ink);font-size:14.5px;outline:none}
  input[type=text]:focus{border-color:var(--accent-2)}
  button{background:var(--accent);color:#08130d;border:0;border-radius:10px;
    padding:0 18px;font-weight:650;cursor:pointer}
  button:disabled{opacity:.45;cursor:wait}
  .rail{display:flex;flex-direction:column;gap:12px;min-height:0}
  .tabs{display:flex;gap:6px;padding:10px 10px 0}
  .tab{flex:1;text-align:center;font-size:12.5px;padding:7px 0;border-radius:8px;cursor:pointer;
    color:var(--muted);border:1px solid transparent}
  .tab.active{background:var(--panel-2);color:var(--ink);border-color:var(--line)}
  .pane{display:none;padding:12px;overflow-y:auto;flex:1;min-height:0}
  .pane.active{display:block}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;
    border-bottom:1px solid #1c2531;font-size:13.5px}
  .row:last-child{border-bottom:0}
  .dim{color:var(--muted);font-size:12px}
  .tag{font:11px var(--mono);padding:1px 6px;border-radius:5px;background:#101820;
    border:1px solid var(--line);color:var(--muted)}
  .tag.high{color:#ffb4ab;border-color:#6b2f2f}
  .tag.overdue{color:var(--warn);border-color:#5c4a1f}
  .bar{height:6px;border-radius:4px;background:#101820;overflow:hidden;margin-top:5px}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
  .block{font:12px var(--mono);color:#b9c7d6;padding:5px 0;border-bottom:1px dashed #1c2531}
  .empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
  footer{font:11.5px var(--mono);color:var(--muted);padding:9px 12px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <div>
    <h1>DayToDay-LLM</h1>
    <div class="sub">Grounded personal assistant &middot; tasks, money, mood, notes</div>
  </div>
  <div class="pill" id="status">provider <b>&hellip;</b></div>
</header>

<main>
  <section class="card">
    <div id="log">
      <div class="msg bot">Ask me about your day. I read your tasks, expenses, journal and notes before answering &mdash; and I say so when something is not in them.</div>
    </div>
    <form id="composer">
      <input id="input" type="text" autocomplete="off"
             placeholder="remind me to submit the synopsis by Friday 5pm" />
      <button id="send" type="submit">Send</button>
    </form>
  </section>

  <aside class="rail">
    <div class="card" style="flex:1">
      <div class="tabs">
        <div class="tab active" data-pane="plan">Plan</div>
        <div class="tab" data-pane="tasks">Tasks</div>
        <div class="tab" data-pane="money">Money</div>
        <div class="tab" data-pane="notes">Notes</div>
      </div>
      <div class="pane active" id="pane-plan"></div>
      <div class="pane" id="pane-tasks"></div>
      <div class="pane" id="pane-money"></div>
      <div class="pane" id="pane-notes"></div>
      <footer id="metrics">loading metrics&hellip;</footer>
    </div>
  </aside>
</main>

<script>
const session = "web-" + Math.random().toString(36).slice(2, 8);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function bubble(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

function chips(container, result) {
  const meta = document.createElement("div");
  meta.className = "meta";
  (result.tool_calls || []).forEach((call, i) => {
    const chip = document.createElement("span");
    chip.className = "chip tool";
    chip.textContent = `${call.name} \u00b7 ${call.latency_ms}ms`;
    const trace = document.createElement("div");
    trace.className = "trace";
    trace.textContent = "args  " + JSON.stringify(call.arguments) + "\nresult " +
      JSON.stringify(call.result, null, 1);
    chip.onclick = () => trace.classList.toggle("open");
    meta.appendChild(chip);
    meta.appendChild(trace);
  });
  (result.retrieved || []).slice(0, 3).forEach(hit => {
    const chip = document.createElement("span");
    chip.className = "chip note";
    chip.textContent = "note: " + hit.title.slice(0, 28);
    chip.onclick = () => alert(hit.title + "\n\n" + hit.snippet);
    meta.appendChild(chip);
  });
  if (result.degraded) {
    const chip = document.createElement("span");
    chip.className = "chip err";
    chip.textContent = "degraded: provider unreachable";
    meta.appendChild(chip);
  }
  $("log").appendChild(meta);
}

async function send(message) {
  bubble("user", message);
  $("send").disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message, session_id: session})
    });
    const data = await res.json();
    bubble("bot", data.reply || "(no reply)");
    chips($("log"), data);
    refreshAll();
  } catch (err) {
    bubble("bot", "The backend is not responding. Start it with: uvicorn daytoday.api:app");
  } finally {
    $("send").disabled = false;
    $("input").focus();
  }
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const value = $("input").value.trim();
  if (!value) return;
  $("input").value = "";
  send(value);
});

document.querySelectorAll(".tab").forEach(tab => tab.onclick = () => {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
  document.querySelectorAll(".pane").forEach(p =>
    p.classList.toggle("active", p.id === "pane-" + tab.dataset.pane));
});

async function refreshPlan() {
  const data = await (await fetch("/api/plan?when=today")).json();
  const blocks = (data.blocks || []).map(b =>
    `<div class="block">${esc(b.start)}&ndash;${esc(b.end)} &nbsp;${esc(b.title)}
       ${b.flag === "overdue" ? '<span class="tag overdue">overdue</span>' : ""}</div>`).join("");
  $("pane-plan").innerHTML =
    `<div class="dim">${esc(data.date_human || "today")} &middot; ${data.pending_count} pending</div>
     ${blocks || '<div class="empty">Nothing scheduled</div>'}
     <div class="dim" style="margin-top:10px">${esc(data.coach_note || "")}</div>
     <div class="dim" style="margin-top:8px">spent today ${esc(data.spend_today || "-")} &middot;
       mood 7d ${data.mood_7d ?? "-"}</div>`;
}

async function refreshTasks() {
  const data = await (await fetch("/api/tasks?status=open")).json();
  const overdue = new Set(data.overdue_ids || []);
  $("pane-tasks").innerHTML = (data.tasks || []).map(t => `
    <div class="row">
      <div>${esc(t.title)}<div class="dim">${esc(t.due_human || "no due date")}</div></div>
      <div style="text-align:right;white-space:nowrap">
        <span class="tag ${t.priority === "high" ? "high" : ""}">${esc(t.priority)}</span>
        ${overdue.has(t.id) ? '<span class="tag overdue">late</span>' : ""}
      </div>
    </div>`).join("") || '<div class="empty">No open tasks</div>';
}

async function refreshMoney() {
  const data = await (await fetch("/api/expenses/summary?period=month")).json();
  const rows = (data.breakdown || []).map(r => `
    <div class="row"><div>${esc(r.category)}<div class="bar"><span style="width:${r.share_pct}%"></span></div></div>
      <div style="text-align:right">${esc(r.total)}<div class="dim">${r.share_pct}%</div></div></div>`).join("");
  $("pane-money").innerHTML =
    `<div class="row"><b>This month</b><b>${esc(data.total || "-")}</b></div>${rows ||
      '<div class="empty">No expenses yet</div>'}`;
}

async function refreshNotes() {
  const data = await (await fetch("/api/health")).json();
  const r = data.records || {};
  $("pane-notes").innerHTML = `
    <div class="row"><div>Notes indexed</div><div>${r.notes ?? 0}</div></div>
    <div class="row"><div>Chunks in FTS5</div><div>${r.note_chunks ?? 0}</div></div>
    <div class="row"><div>Journal entries</div><div>${r.journal ?? 0}</div></div>
    <div class="row"><div>Tasks open</div><div>${r.tasks_open ?? 0}</div></div>
    <div class="dim" style="margin-top:10px">Retrieval: BM25 over porter-stemmed chunks,
      ${data.mean_tool_latency_ms ?? 0}ms mean tool latency.</div>`;
  $("metrics").innerHTML =
    `${esc(data.provider)} &middot; ${esc(data.model)} &middot; ${data.tool_calls} tool calls &middot;
     err ${(100 * (data.tool_error_rate || 0)).toFixed(1)}% &middot; ${data.mean_tool_latency_ms}ms`;
  $("status").innerHTML = `provider <b>${esc(data.provider)}</b>`;
}

function refreshAll() {
  refreshPlan().catch(() => {});
  refreshTasks().catch(() => {});
  refreshMoney().catch(() => {});
  refreshNotes().catch(() => {});
}

// Demo mode: open the dashboard with ?demo=1 to replay a scripted
// conversation through the real API. Used for screenshots, the viva, and for
// anyone who wants to see the tool traces without typing.
const DEMO_SCRIPT = [
  "what did i write about normalisation",
  "who won the 1983 world cup",
  "remind me to submit the synopsis by friday 5pm",
  "i spent 250 on coffee",
  "how much did i spend this month",
  "plan my day"
];

async function runDemo() {
  for (const message of DEMO_SCRIPT) {
    await send(message);
    await new Promise(resolve => setTimeout(resolve, 500));
  }
}

refreshAll();
setInterval(() => refreshNotes().catch(() => {}), 15000);
if (new URLSearchParams(location.search).has("demo")) {
  setTimeout(runDemo, 400);
}
</script>
</body>
</html>
